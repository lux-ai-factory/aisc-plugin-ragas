[project]
name = "aisc-plugin-ragas"
version = "0.1.0"
description = "AISC evaluation plugin wrapping the ragas RAG-evaluation library (vendored in this repo)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aisc-plugin-interface @ git+https://github.com/lux-ai-factory/aisc-plugin-interface.git@v0.2.4",
    # --- wrapper deps ---
    "pandas>=2.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.0.0",
    "faiss-cpu>=1.7.0",
    "pypdf>=3.0.0",
    "transformers>=4.30.0",
    "langchain-mistralai>=0.1.0,<1.0",
    "langchain-huggingface>=0.1.0,<1.0",
    "langchain-anthropic>=0.1.0,<1.0",
    "langchain-google-genai>=1.0.0,<3.0",
    # --- ragas (vendored in ./src/ragas) runtime deps ---
    "numpy>=1.21.0,<3.0.0",
    "datasets>=4.0.0",
    "tiktoken",
    "pydantic>=2.0.0",
    "nest-asyncio",
    "appdirs",
    "diskcache>=5.6.3",
    "typer",
    "rich",
    "openai>=1.0.0",
    "tqdm",
    "instructor",
    "pillow>=10.4.0",
    "networkx",
    "scikit-network",
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-openai",
]

[project.optional-dependencies]
report = ["vera-report-plugin-interface", "sqlalchemy>=2.0.48", "jinja2>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# One wheel = vendored ragas library (the tool) + AISC wrapper + report module.
packages = [
    "src/ragas",
    "src/aisc_plugin_ragas",
    "report/aisc_plugin_ragas_report",
]

[tool.uv.sources]
aisc-plugin-interface = { git = "https://github.com/lux-ai-factory/aisc-plugin-interface.git", tag = "v0.2.4" }
vera-report-plugin-interface = { git = "https://github.com/lux-ai-factory/vera-report-plugin-interface" }
